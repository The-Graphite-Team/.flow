name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: pyinstaller --clean flow_runner.spec

      - name: Assemble release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release/package/examples | Out-Null
          Copy-Item dist/flow_runner.exe release/flow_runner.exe
          Copy-Item examples/*.flow release/package/examples/
          Copy-Item dist/flow_runner.exe release/package/flow_runner.exe
          Copy-Item README.md, INSTALL.md, VERIFYING.md, LICENSE release/package/
          Compress-Archive -Path release/package/* -DestinationPath release/flow-runner-windows.zip -Force
          $files = @("release/flow_runner.exe", "release/flow-runner-windows.zip")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/flow_runner.exe,release/flow-runner-windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: main
          name: .flow ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/flow_runner.exe
            release/flow-runner-windows.zip
            release/SHA256SUMS.txt
            examples/startup-demo.flow
            examples/helpdesk-demo.flow
            INSTALL.md
            VERIFYING.md
